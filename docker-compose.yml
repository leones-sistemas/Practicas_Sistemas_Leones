services:

  db:
    image: postgres:16
    container_name: postgres_php
    restart: always
    environment:
      POSTGRES_DB: mi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  php:
    build: .
    container_name: php_app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"

volumes:
  postgres_data: